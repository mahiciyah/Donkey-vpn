name: Android debug build (personal fork)

# Mirrors the Android steps of the upstream release workflow (Windows runner,
# NDK 27.2.12479018, npm run fetch:android, gradlew.bat), minus signing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem -Path @(
            (Join-Path $env:ANDROID_HOME 'cmdline-tools'),
            (Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools')
          ) -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw 'Android sdkmanager.bat was not found on the hosted runner.' }
          & $sdkManager 'ndk;27.2.12479018'
      - name: Install dependencies
        run: npm ci
      - name: Fetch verified Android native assets
        run: npm run fetch:android
      - name: Diagnose native inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- git status after fetch (files changed by fetch:android) ---'
          git status --short
          Write-Host '--- files under native-inputs/android ---'
          Get-ChildItem native-inputs/android -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring((Get-Location).Path.Length) }
          Write-Host '--- arm64 libaether.so actual sha256 ---'
          $lib = 'native-inputs/android/verified-jni/arm64-v8a/libaether.so'
          if (Test-Path $lib) { (Get-FileHash $lib -Algorithm SHA256).Hash } else { 'MISSING: ' + $lib }
          Write-Host '--- expected values (verified-native-inputs.json) ---'
          $manifest = 'native-inputs/android/verified-native-inputs.json'
          if (Test-Path $manifest) { Get-Content $manifest -TotalCount 40 } else { 'MISSING: ' + $manifest }
          exit 0
      - name: Build debug APKs
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aethon-elder-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
